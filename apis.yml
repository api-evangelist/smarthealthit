apis:
- aid: smarthealthit:smarthealthit-health-cards-framework
  name: SMART Health Cards Framework
  tags:
  - Health Cards
  - Verifiable Credentials
  - Immunization Records
  - Health Links
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://smarthealth.cards
  baseURL: https://spec.smarthealth.cards
  properties:
  - url: https://spec.smarthealth.cards/
    type: Documentation
  description: >-
    Specification for issuing and verifying tamper-evident clinical records - vaccination history, lab
    results, and insurance cards - as signed JWS payloads carried in QR codes or files. Issuers expose
    the FHIR $health-cards-issue operation; verifiers validate signatures against published issuer keys.
    SMART Health Links extend the model to shareable links over richer clinical data. Maintained with
    the Verifiable Clinical Information (VCI) coalition.
